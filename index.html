<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세상을 돕는 AI 프로젝트 보드</title>
    <style>
        :root { --primary-color: #4A90E2; --secondary-color: #50E3C2; --bg-color: #F4F7F6; --text-color: #333; --card-bg: #FFFFFF; }
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        header { background-color: var(--primary-color); color: white; padding: 20px; text-align: center; }
        nav { display: flex; justify-content: center; background-color: #357ABD; flex-wrap: wrap; }
        nav button { background: none; border: none; color: white; padding: 15px 20px; font-size: 15px; cursor: pointer; transition: background 0.3s; }
        nav button:hover, nav button.active { background-color: var(--secondary-color); color: #333; font-weight: bold; }
        .container { max-width: 900px; margin: 30px auto; background-color: var(--card-bg); padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .section { display: none; }
        .section.active { display: block; }
        h2 { color: var(--primary-color); border-bottom: 2px solid var(--secondary-color); padding-bottom: 10px; margin-top: 30px; }
        h3 { color: #333; margin-top: 25px; }
        .form-group { margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: inherit; }
        button.submit-btn { background-color: var(--primary-color); color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; display: block; width: 100%; margin-top: 10px; }
        button.submit-btn:hover { background-color: #357ABD; }
        .iframe-container { width: 100%; height: 500px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }
        .code-image { width: 100%; max-height: 400px; object-fit: contain; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; background-color: #f9f9f9; }
        .popup-btn { background-color: #333; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .popup-btn:hover { background-color: #555; }
        .debugging-board { background-color: #fff3cd; padding: 15px; border-radius: 8px; margin-top: 30px; border-left: 5px solid #ffecb5; }
    </style>
</head>
<body>
    <header>
        <h1>세상을 돕는 AI 프로젝트 보드</h1>
        <p>친구들의 인공지능 프로그램을 시연하고, 코드를 보며 디버깅해 보아요!</p>
    </header>

    <nav>
        <button class="tab-link active" onclick="openTab('proj1')">학생작품1</button>
        <button class="tab-link" onclick="openTab('proj2')">학생작품2</button>
        <button class="tab-link" onclick="openTab('proj3')">학생작품3</button>
    </nav>

    <div class="container">
        <!-- 학생작품1 -->
        <div id="proj1" class="section active">
            <h2>학생작품1 시연 및 디버깅</h2>
            
            <h3>▶ 프로그램 실행 화면</h3>
            <div class="iframe-container">
                <iframe src="https://playentry.org/iframe/6ad4233780216b763f6d1126" allow="camera; microphone; autoplay"></iframe>
            </div>

            <h3>💻 블록 코드 보기</h3>
            <img src="1.png" alt="학생작품1 코드 이미지" class="code-image" onerror="this.src='https://via.placeholder.com/800x400?text=Image+1.png+not+found'">
            <button class="popup-btn" onclick="openCodePopup('https://playentry.org/ws/6ad4233780216b763f6d1126?type=normal&mode=block&lang=ko')">
                새 창(팝업)에서 전체 코드 보기 및 수정하기
            </button>

            <div class="debugging-board">
                <h3>🛠️ 디버깅 게시판</h3>
                <p>실행 중 발견한 오류나 고치면 좋을 점을 남겨주세요.</p>
                <div class="form-group">
                    <input type="text" placeholder="예: 카메라 인식이 너무 느려요. 블록 순서를 바꿔보면 어떨까요?" id="qna-input-1">
                </div>
                <button class="submit-btn" onclick="alert('디버깅 의견이 등록되었습니다!')">의견 남기기</button>
            </div>
        </div>

        <!-- 학생작품2 -->
        <div id="proj2" class="section">
            <h2>학생작품2 시연 및 디버깅</h2>
            
            <h3>▶ 프로그램 실행 화면</h3>
            <div class="iframe-container">
                <iframe src="https://playentry.org/iframe/6ad423693c266ef5c93bdf7c" allow="camera; microphone; autoplay"></iframe>
            </div>

            <h3>💻 블록 코드 보기</h3>
            <img src="2.png" alt="학생작품2 코드 이미지" class="code-image" onerror="this.src='https://via.placeholder.com/800x400?text=Image+2.png+not+found'">
            <button class="popup-btn" onclick="openCodePopup('https://playentry.org/ws/6ad423693c266ef5c93bdf7c?type=normal&mode=block&lang=ko')">
                새 창(팝업)에서 전체 코드 보기 및 수정하기
            </button>

            <div class="debugging-board">
                <h3>🛠️ 디버깅 게시판</h3>
                <div class="form-group">
                    <input type="text" placeholder="예: 버튼을 눌렀을 때 다음 화면으로 넘어가지 않아요." id="qna-input-2">
                </div>
                <button class="submit-btn" onclick="alert('디버깅 의견이 등록되었습니다!')">의견 남기기</button>
            </div>
        </div>

        <!-- 학생작품3 -->
        <div id="proj3" class="section">
            <h2>학생작품3 시연 및 디버깅</h2>
            
            <h3>▶ 프로그램 실행 화면</h3>
            <div class="iframe-container">
                <iframe src="https://playentry.org/iframe/6ad4234f80216b763f6d1182" allow="camera; microphone; autoplay"></iframe>
            </div>

            <h3>💻 블록 코드 보기</h3>
            <img src="3.png" alt="학생작품3 코드 이미지" class="code-image" onerror="this.src='https://via.placeholder.com/800x400?text=Image+3.png+not+found'">
            <button class="popup-btn" onclick="openCodePopup('https://playentry.org/ws/6ad4234f80216b763f6d1182?type=normal&mode=block&lang=ko')">
                새 창(팝업)에서 전체 코드 보기 및 수정하기
            </button>

            <div class="debugging-board">
                <h3>🛠️ 디버깅 게시판</h3>
                <div class="form-group">
                    <input type="text" placeholder="예: 음성 인식이 잘 안 될 때 안내 메시지가 있으면 좋겠어요." id="qna-input-3">
                </div>
                <button class="submit-btn" onclick="alert('디버깅 의견이 등록되었습니다!')">의견 남기기</button>
            </div>
        </div>

    </div>

    <script>
        function openTab(tabName) {
            var i;
            var x = document.getElementsByClassName("section");
            var btn = document.getElementsByClassName("tab-link");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
                btn[i].className = btn[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            event.currentTarget.className += " active";
        }

        function openCodePopup(url) {
            var popupWidth = 1000;
            var popupHeight = 700;
            var left = (window.screen.width / 2) - (popupWidth / 2);
            var top = (window.screen.height / 2) - (popupHeight / 2);
            window.open(url, 'EntryCodeWindow', 'width=' + popupWidth + ',height=' + popupHeight + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes');
        }
    </script>
</body>
</html>
